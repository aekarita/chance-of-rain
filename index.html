<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>พยากรณ์ฝนฟรุ้งฟริ้ง 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="lang-switch">
    <button class="lang-btn active" id="btn-th" onclick="toggleLang('th')">TH</button>
    <button class="lang-btn" id="btn-en" onclick="toggleLang('en')">EN</button>
</div>

<div class="container">
    <h1 id="title">🌦️ พยากรณ์ฝนฟรุ้งฟริ้ง ✨</h1>
    
    <div class="how-to-box">
        <button class="how-to-btn" onclick="toggleHowTo()">
            <span id="how-to-title">❓ วิธีใช้งาน (How to use)</span>
        </button>
        <div class="how-to-content" id="howToContent">
            <p id="how-to-text">
                1. สมัครใช้งานที่ <a href="https://app.tomorrow.io/signin" target="_blank">Tomorrow.io</a><br>
                2. ไปที่หน้า <a href="https://app.tomorrow.io/development/keys" target="_blank">API Keys</a><br>
                3. ก๊อปปี้ <b>My API Key</b> มาใส่ในช่องด้านล่างจ้า (ใส่ครั้งเดียวจบ!)<br>
                4. ใส่พิกัดละติจูด ลองจิจูด แล้วกดดูพยากรณ์ได้เลยจ้า!
            </p>
        </div>
    </div>

    <!-- ส่วนของ API Key ที่จะถูกซ่อนถ้ามีข้อมูลอยู่แล้ว -->
    <div id="keySection">
        <input type="password" id="apiKey" class="key-input" placeholder="วาง API Key ตรงนี้เลยจ้า">
    </div>
    
    <!-- ปุ่มสำหรับกดแสดงช่องแก้ Key กรณีต้องการเปลี่ยน -->
    <button id="changeKeyBtn" style="display:none;" onclick="showKeyInput()">🔑 Change API Key</button>

    <input type="text" id="coords" placeholder="พิกัด Lat, Long Ex. 19.8600959, 99.5988229">
    
    <br>
    <button id="fetchBtn" onclick="getRainForecast()">ดูพยากรณ์เลยยย 💖</button>

    <table id="resultTable">
        <thead>
            <tr>
                <th id="th-time">ระยะเวลา</th>
                <th id="th-prob">โอกาสฝนตก (%)</th>
            </tr>
        </thead>
        <tbody id="resultBody"></tbody>
    </table>
    
</div>

<div style="position: fixed; bottom: 15px; right: 15px; z-index: 1000; opacity: 0.7; transition: opacity 0.3s;" 
     onmouseover="this.style.opacity='1'" 
     onmouseout="this.style.opacity='0.7'">
     <img src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Faekarita.github.io%2Fchance-of-rain%2F&label=Visit&icon=github&color=%23ff69b4">
    
</div>
<script src="script.js"></script>
</body>
</html>
